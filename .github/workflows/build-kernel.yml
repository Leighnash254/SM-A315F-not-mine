name: Build Samsung Galaxy A31 / A41 (Zareth Kernel - KernelSU-Next & SuSFS)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device'
        required: true
        type: choice
        default: 'all'
        options: [all, a31, a41]
      su_variant:
        description: 'Root & SuSFS variant'
        required: true
        type: choice
        default: 'ksun_susfs'
        options: [ksun_susfs, ksun_nosusfs, vanilla]
      ksu_source:
        description: 'KernelSU-Next source: intree = keep drivers/kernelsu from your repo (safe default), upstream = replace with the branch below'
        required: true
        type: choice
        default: 'intree'
        options: [intree, upstream]
      ksu_branch:
        description: 'KernelSU-Next branch (only used when ksu_source = upstream)'
        required: false
        type: string
        default: 'legacy'
      ksu_ref:
        description: 'KernelSU-Next tag/commit to pin (empty = branch HEAD)'
        required: false
        type: string
        default: ''
      susfs_repo:
        description: 'susfs4ksu repo URL (use a 4.14 backport fork if upstream has no 4.14 branch)'
        required: false
        type: string
        default: 'https://gitlab.com/simonpunk/susfs4ksu.git'
      susfs_branch:
        description: 'susfs4ksu branch'
        required: false
        type: string
        default: 'kernel-4.14'
      susfs_ref:
        description: 'susfs4ksu tag/commit to pin (empty = branch HEAD)'
        required: false
        type: string
        default: ''
      make_release:
        description: 'Create/Update GitHub Release on success'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (include "Beta" for a pre-release)'
        required: false
        type: string
        default: 'v1.0.0-Rev3'

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  KBUILD_BUILD_USER: zareth
  KBUILD_BUILD_HOST: github-actions
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: '1'
  CCACHE_MAXSIZE: '2G'
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,file_macro

jobs:
  build:
    name: Build ${{ matrix.device }} (${{ inputs.su_variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Replaces the separate matrix_prep job (saves a runner spin-up)
        device: ${{ fromJson(inputs.target_device == 'all' && '["a31","a41"]' || format('["{0}"]', inputs.target_device)) }}

    env:
      DEVICE: ${{ matrix.device }}
      VARIANT: ${{ inputs.su_variant }}
      KSU_SOURCE: ${{ inputs.ksu_source }}
      KSU_BRANCH: ${{ inputs.ksu_branch }}
      KSU_REF: ${{ inputs.ksu_ref }}
      SUSFS_REPO: ${{ inputs.susfs_repo }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      SUSFS_REF: ${{ inputs.susfs_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 cpio \
            zip unzip python3 xxd ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # Toolchain: cached instead of re-cloned (~1GB) on every run
      - name: Restore Proton Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/proton-clang
          key: proton-clang-13-v1

      - name: Download Proton Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/toolchains/proton-clang

      - name: Add toolchain to PATH
        run: |
          echo "$HOME/toolchains/proton-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/proton-clang/bin/clang" --version | head -n1

      # ccache makes re-builds of the same device/variant dramatically faster
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ inputs.su_variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ inputs.su_variant }}-
            ccache-${{ matrix.device }}-

      - name: Setup KernelSU-Next & SuSFS
        id: root
        run: |
          set -euo pipefail
          KSU_INFO="none"; SUSFS_INFO="none"; KSU_VER=""

          clone_pinned() { # url branch ref dest
            git clone --filter=blob:none -b "$2" "$1" "$4"
            if [ -n "$3" ]; then
              git -C "$4" checkout "$3"
            fi
          }

          integrate_ksu() {
            if [ "$KSU_SOURCE" = "intree" ]; then
              # Keep the repo's own KernelSU-Next (includes your SDP/throne-tracker fixes)
              if [ ! -f drivers/kernelsu/Kconfig ]; then
                echo "::error::drivers/kernelsu not found in the repo. Use ksu_source=upstream or point me to where KernelSU-Next lives."
                exit 1
              fi
              KSU_INFO="in-tree@$(git rev-parse --short HEAD)"
              if [ "$VARIANT" = "ksun_susfs" ]; then
                if ! grep -q 'config KSU_SUSFS$' drivers/kernelsu/Kconfig; then
                  P=/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
                  echo "In-tree KSU has no KSU_SUSFS option; trying $P"
                  if patch -p2 -d drivers/kernelsu --dry-run < "$P" > /tmp/ksu_susfs_dry.log 2>&1; then
                    patch -p2 -d drivers/kernelsu --no-backup-if-mismatch < "$P"
                  else
                    cat /tmp/ksu_susfs_dry.log
                    echo "::error::SuSFS KernelSU patch does not apply to the in-tree KernelSU-Next"
                    exit 1
                  fi
                fi
                grep -n 'KSU_SUSFS' drivers/kernelsu/Kconfig | head -n 20
              fi
              grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
              grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
              return 0
            fi

            clone_pinned https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_BRANCH" "$KSU_REF" /tmp/KernelSU-Next
            KSU_SHA=$(git -C /tmp/KernelSU-Next rev-parse --short HEAD)
            KSU_COUNT=$(git -C /tmp/KernelSU-Next rev-list --count HEAD)
            KSU_TAG=$(git -C /tmp/KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo "$KSU_BRANCH")
            KSU_INFO="$KSU_TAG@$KSU_SHA"

            rm -rf drivers/kernelsu
            cp -r /tmp/KernelSU-Next/kernel drivers/kernelsu
            if [ -d /tmp/KernelSU-Next/uapi ]; then
              rm -rf drivers/kernelsu/include/uapi
              cp -r /tmp/KernelSU-Next/uapi drivers/kernelsu/include/uapi
            fi
            grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

            # NOTE: formula assumed from KernelSU-Next's Makefile (10000 + 200 + commit count).
            # Verify against drivers/kernelsu/Makefile if the manager shows a wrong version.
            echo "KSU_VERSION_OVERRIDE=$((10200 + KSU_COUNT))" >> "$GITHUB_ENV"
            echo "KSU_VERSION_TAG_OVERRIDE=$KSU_TAG" >> "$GITHUB_ENV"

            # GITHUB_ENV only reaches *later* steps, so export for the script below too
            export KSU_VERSION_OVERRIDE=$((10200 + KSU_COUNT)) KSU_VERSION_TAG_OVERRIDE="$KSU_TAG"

            if [ "$VARIANT" = "ksun_susfs" ]; then
              if ! grep -q 'config KSU_SUSFS$' drivers/kernelsu/Kconfig; then
                P=/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
                echo "KSU Kconfig has no KSU_SUSFS option; applying $P"
                if patch -p2 -d drivers/kernelsu --dry-run < "$P" > /tmp/ksu_susfs_dry.log 2>&1; then
                  patch -p2 -d drivers/kernelsu --no-backup-if-mismatch < "$P"
                else
                  cat /tmp/ksu_susfs_dry.log
                  echo "::error::SuSFS KernelSU patch does not apply to KernelSU-Next $KSU_BRANCH"
                  exit 1
                fi
              fi
              echo "--- SuSFS symbols in drivers/kernelsu/Kconfig ---"
              grep -n 'KSU_SUSFS' drivers/kernelsu/Kconfig | head -n 20 \
                || { echo "::error::KSU_SUSFS still missing from Kconfig"; exit 1; }
            fi

            [ -f scripts/patch_ksu_414.py ] || { echo "::error::scripts/patch_ksu_414.py missing"; exit 1; }
            python3 scripts/patch_ksu_414.py
          }

          integrate_susfs() {
            echo "Branches available on $SUSFS_REPO:"
            git ls-remote --heads "$SUSFS_REPO" | sed 's|.*refs/heads/||'
            if ! git ls-remote --exit-code --heads "$SUSFS_REPO" "$SUSFS_BRANCH" >/dev/null; then
              echo "::error::Branch '$SUSFS_BRANCH' not found in $SUSFS_REPO (see list above). Set susfs_repo/susfs_branch."
              exit 1
            fi
            clone_pinned "$SUSFS_REPO" "$SUSFS_BRANCH" "$SUSFS_REF" /tmp/susfs4ksu
            ls /tmp/susfs4ksu/kernel_patches
            SUSFS_VER=$(grep -oP '#define SUSFS_VERSION "\K[^"]+' /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h || echo unknown)
            SUSFS_INFO="$SUSFS_VER@$(git -C /tmp/susfs4ksu rev-parse --short HEAD)"

            cp -vf /tmp/susfs4ksu/kernel_patches/fs/* fs/
            cp -vf /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/

            # Strict apply: a half-applied SuSFS patch produces a kernel that boots but misbehaves.
            PATCH_FILE=$(ls /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel*.patch | head -n1)
            echo "Applying $PATCH_FILE"
            set +e
            patch -p1 --no-backup-if-mismatch -F3 < "$PATCH_FILE"
            set -e
            REJECTS=$(find . -name '*.rej' | sort)
            if [ "$REJECTS" = "./fs/namespace.c.rej" ]; then
              # Known failure on Samsung trees: only hunk #1 (includes/declarations) fails.
              echo "Applying known namespace.c hunk by anchor"
              python3 scripts/fix_susfs_namespace_414.py
              rm -f fs/namespace.c.rej
            elif [ -n "$REJECTS" ]; then
              echo "::error::Unexpected SuSFS patch rejects:"
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
          }

          case "$VARIANT" in
            ksun_susfs)   integrate_susfs; integrate_ksu ;;
            ksun_nosusfs) integrate_ksu ;;
            vanilla)      echo "Vanilla: no root injection" ;;
          esac

          echo "ksu=$KSU_INFO"     >> "$GITHUB_OUTPUT"
          echo "susfs=$SUSFS_INFO" >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next: $KSU_INFO | SuSFS: $SUSFS_INFO"

      - name: Configure kernel
        run: |
          set -euo pipefail
          DEFCONFIG="${DEVICE}_defconfig"
          [ -f "arch/arm64/configs/$DEFCONFIG" ] || { echo "::error::$DEFCONFIG not found"; exit 1; }

          MK=(make O=out ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu-
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          "${MK[@]}" "$DEFCONFIG"

          cfg() { scripts/config --file out/.config "$@"; }
          en()  { for s in "$@"; do cfg -e "$s"; done; }
          dis() { for s in "$@"; do cfg -d "$s"; done; }

          # Knox / integrity tripwires
          dis UH RUSTUH_RKP RUSTUH_KDP RKP RKP_KDP RKP_CFP DEFEX SECURITY_DEFEX TIMA INTEGRITY \
              KNOX_KAP SECURITY_SELINUX_ALWAYS_ENFORCE LTO LTO_CLANG CC_STACKPROTECTOR_STRONG \
              STRICT_MODULE_RWX LOCALVERSION_AUTO
          en  LTO_NONE CC_STACKPROTECTOR_NONE SECURITY_SELINUX_DEVELOP ALWAYS_PERMISSIVE

          cfg --set-str LOCALVERSION " Zareth Kernel ${RELEASE_TAG}"

          # Size optimization
          dis CC_OPTIMIZE_FOR_PERFORMANCE DEBUG_INFO PAGE_OWNER SLUB_DEBUG
          en  CC_OPTIMIZE_FOR_SIZE STRIP_ASM_SYMS

          # Samsung SDP / FBE
          en SDP FSCRYPT_SDP FS_ENCRYPTION_INLINE_CRYPT

          # RAM / CPU / net / power / IO
          en  ZRAM ZRAM_WRITEBACK ZSMALLOC CRYPTO_LZ4 CRYPTO_ZSTD PROCESS_RECLAIM VMPRESSURE
          dis ZSMALLOC_STAT
          en  SCHED_TUNE CPU_FREQ_GOV_SCHEDUTIL CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
          en  TCP_CONG_ADVANCED TCP_CONG_BBR
          cfg --set-str DEFAULT_TCP_CONG bbr
          en  PM_AUTOSLEEP PM_WAKELOCKS WQ_POWER_EFFICIENT_DEFAULT CPU_IDLE CPU_IDLE_GOV_MENU
          en  MQ_IOSCHED_DEADLINE MQ_IOSCHED_KYBER IOSCHED_BFQ IOSCHED_DEADLINE

          if [ "$VARIANT" != "vanilla" ]; then
            # Manual hooks, no kprobes
            en  KSU KSU_MANUAL_HOOK HAVE_KPROBES OVERLAY_FS
            dis KPROBES KPROBE_EVENTS KSU_KPROBES_HOOK KSU_SYSCALL_TABLE_HOOK KSU_ALLOWLIST_WORKAROUND
          fi
          if [ "$VARIANT" = "ksun_susfs" ]; then
            en KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
               KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
               KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
               KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
               KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT
            dis KSU_SUSFS_SUS_SU
          fi

          "${MK[@]}" olddefconfig

          # olddefconfig silently drops symbols with unmet deps: fail loudly instead
          need() { grep -q "^CONFIG_$1=y" out/.config || { echo "::error::CONFIG_$1 not set after olddefconfig"; exit 1; }; }
          if [ "$VARIANT" != "vanilla" ]; then need KSU; fi
          if [ "$VARIANT" = "ksun_susfs" ]; then need KSU_SUSFS; fi
          grep -E "CONFIG_LOCALVERSION=|CONFIG_KSU|CONFIG_SDP|CONFIG_ALWAYS_PERMISSIVE|CONFIG_TCP_CONG_BBR=|CONFIG_KPROBES" out/.config || true

      - name: Compile kernel
        run: |
          set -euo pipefail
          ccache -z
          make -j"$(nproc)" O=out ARCH=arm64 CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" \
            Image.gz dtbs 2>&1 | tee build.log
          [ -f out/arch/arm64/boot/Image.gz ] || { echo "::error::Image.gz missing"; exit 1; }
          ccache -s

      - name: Append DTB
        run: |
          set -euo pipefail
          B=out/arch/arm64/boot
          DTB="$B/dts/mediatek/mt6768.dtb"
          if [ -f "$DTB" ]; then
            cat "$B/Image.gz" "$DTB" > "$B/Image.gz-dtb"
          else
            echo "::warning::mt6768.dtb not found, using plain Image.gz"
            cp "$B/Image.gz" "$B/Image.gz-dtb"
          fi
          ls -lh "$B"/Image*

      - name: Package (AnyKernel3)
        id: package
        run: |
          set -euo pipefail
          UPPER=$(echo "$DEVICE" | tr '[:lower:]' '[:upper:]')
          SAFE_TAG=$(echo "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '_')
          ZIP_NAME="SM-${UPPER}-ZarethKernel-${SAFE_TAG}-${VARIANT}.zip"

          mkdir -p staging && cd staging
          git clone --depth=1 https://github.com/Edhic1/AnyKernel3.git -b Samsung_A31 anykernel
          cd anykernel
          rm -rf .git README.md

          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's|BLOCK=/dev/block/by-name/boot;|BLOCK=boot;|' anykernel.sh
          sed -i "s|kernel.string=.*|kernel.string=Zareth Kernel ${RELEASE_TAG} (${VARIANT}) for Samsung A31/A41|" anykernel.sh

          # Samsung recovery metadata / partition locking workaround
          echo "# Dummy file; update-binary is a shell script." > META-INF/com/google/android/updater-script
          sed -i 's|for mount in /cache /data /metadata /persist; do|for mount in /cache; do|' META-INF/com/google/android/update-binary
          sed -i 's|/metadata||g' META-INF/com/google/android/update-binary

          cp "$GITHUB_WORKSPACE"/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 -q "../$ZIP_NAME" . -x '*placeholder'
          cd ..
          sha256sum "$ZIP_NAME" > "sha256-${DEVICE}.txt"   # per-device name: no clobbering in the release job
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -lh

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.device }}
          path: |
            staging/*.zip
            staging/sha256-*.txt
          if-no-files-found: error

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.device }}
          path: |
            out/.config
            build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save build info
        run: |
          printf 'ksu=%s\nsusfs=%s\n' "${{ steps.root.outputs.ksu }}" "${{ steps.root.outputs.susfs }}" > build-info-${DEVICE}.env
      - uses: actions/upload-artifact@v4
        with:
          name: info-${{ matrix.device }}
          path: build-info-*.env

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: inputs.make_release == true && needs.build.result == 'success'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VARIANT: ${{ inputs.su_variant }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: '{zip,info}-*'
          merge-multiple: true

      - name: Prepare assets & notes
        id: notes
        run: |
          set -euo pipefail
          mkdir release_assets
          cp all/*.zip release_assets/
          cat all/sha256-*.txt > release_assets/sha256sums.txt

          # Always ship the *current* official manager APKs instead of hardcoded URLs
          if [ "$VARIANT" != "vanilla" ]; then
            gh release download --repo KernelSU-Next/KernelSU-Next --pattern '*.apk' --dir release_assets \
              || echo "::warning::Could not fetch manager APKs"
            (cd release_assets && sha256sum *.apk >> sha256sums.txt 2>/dev/null || true)
          fi

          source <(cat all/build-info-*.env | sort -u | head -n2)
          [[ "$RELEASE_TAG" =~ [Bb]eta|rc ]] && echo "pre=true" >> "$GITHUB_OUTPUT" || echo "pre=false" >> "$GITHUB_OUTPUT"

          {
            echo "## Zareth Kernel ${RELEASE_TAG} - Samsung Galaxy A31 (SM-A315F) / A41 (SM-A415F)"
            echo
            echo "- **Chipset:** MediaTek Helio P65 (MT6768), Linux 4.14"
            echo "- **Variant:** \`${VARIANT}\`"
            echo "- **KernelSU-Next:** \`${ksu}\`"
            echo "- **SuSFS:** \`${susfs}\`"
            echo "- **SELinux:** permissive | **Hooks:** manual inline (no kprobes)"
            echo
            echo "### Files"
            (cd release_assets && ls -1 *.zip *.apk 2>/dev/null | sed 's/^/- `/; s/$/`/')
            echo
            echo "### Flashing"
            echo "1. Flash the zip for your device in TWRP / OrangeFox or a kernel flasher."
            echo "2. Reboot, then install/upgrade the KernelSU-Next manager APK."
            echo "3. Verify with \`sha256sums.txt\`."
          } > release_assets/release_notes.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Samsung Galaxy A31 / A41 - Zareth Kernel ${{ inputs.release_tag }}
          prerelease: ${{ steps.notes.outputs.pre }}
          body_path: release_assets/release_notes.md
          files: |
            release_assets/*.zip
            release_assets/*.apk
            release_assets/sha256sums.txt
